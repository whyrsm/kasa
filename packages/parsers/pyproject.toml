[project]
name = "kasa-parsers"
version = "0.1.0"
description = "Parse Indonesian bank statement PDFs into TSV."
requires-python = ">=3.11"
dependencies = [
    "pymupdf>=1.24",
]

[dependency-groups]
dev = [
    "pytest>=8.0",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["kasa_parsers"]
